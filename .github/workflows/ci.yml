name: CI

on:
  push:
    branches: [main, feat/**, warden/**]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Run tests
        run: npm run test:ci

      - name: Run smoke test
        run: npm run smoke

      - name: Check CLI works
        run: |
          node dist/index.js --version
          node dist/index.js --help
          node dist/index.js validate || true

      - name: Upload coverage artifact
        if: matrix.node-version == '24.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-24
          path: coverage

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: TypeScript check
        run: npm run build

      - name: Format check
        run: npm run format:check

      - name: Verify package can be packed
        run: npm pack --dry-run

  verification-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Verify a real dependency patch with host and container runners
        env:
          WARDEN_LIVE_DOCKER: '1'
        run: node scripts/verification-live-smoke.js
